<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style type="text/css">
        .main-div {
            margin: 50px 100px;
            border: 1px solid gray;
        }

        .child-div {
            width: 300px;
            height: 150px;
            border: 1px solid gray;
            margin:0 auto;
        }
    </style>
    <script type="text/javascript">
        var oldStart, oldEnd
        function onKeyDown(e) {
            let keyCode = e.keyCode;
            let isValid = false;
            if (keyCode >= 48 && keyCode <= 57 || keyCode >= 96 && keyCode <= 105)
                isValid = true;

            let array = [8, 9, 37, 38, 39, 40, 46];
            if (array.indexOf(keyCode) != -1)
                isValid = true;
            console.log(keyCode);
            console.log(isValid);
            if (!isValid) 
                e.preventDefault();
        }
        function onInput(e) {
            let input = e.target, start = input.selectionStart, end = input.selectionEnd;
            let count = input.value.substring(0, start).split(',').length - 1;
            input.value = sepreate3Digit(input.value);
            let count1 = input.value.substring(0, start).split(',').length - 1;
            if (count != count1) {
                input.selectionStart = start + 1;
                input.selectionEnd = end + 1;
            }
            else {
                input.selectionStart = start;
                input.selectionEnd = end;
            }
            console.log('count: ' + count + ' -- count1: ' + count1);
            console.log(input.selectionStart + '--' + start);
        }
        function sepreate3Digit(value) {
            value = value.replace(/,/g, '');
            let str = '', counter = 3 - value.length % 3;
            for (let index in value) {
                str += value[index];
                counter++;
                if (counter % 3 == 0 && counter <= value.length) {
                    str += ',';
                }
            }
            return str;
        }
    </script>
    <link href="" rel="stylesheet" />
</head>
<body style="">
    <div class="child-div">
        <input onkeydown="onKeyDown(event)" oninput="onInput(event)" />
    </div>
</body>
</html>
