<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style type="text/css">
        .modal{
            position:fixed;
            left:0;
            right:0;
            top:0;
            bottom:0;
            background-color:rgba(0, 0, 0, 0.12);
            z-index:10000000;
            pointer-events:none;
            overflow:hidden;
        }
    </style>
    <script type="text/javascript">
        function test() {
            let el = document.getElementById('test');
            let rec = el.getBoundingClientRect();
            let target = document.getElementById('target');
            target.style.left = rec.left + 'px';
            target.style.top = rec.top + 'px';
            var div = document.createElement('div');
            div.className = 'modal';
            document.body.appendChild(div)
        }
    </script>

</head>
<body style="direction:rtl">
    <div style="height:350px;border:1px solid gray"></div>
    <div style="height:350px;border:1px solid gray"></div>
    <div style="height:250px;border:1px solid gray;overflow:auto">
        <div style="height:350px;border:1px solid red"></div>
        <div id="test" style="height:30px;width:300px;margin:0 auto;border:1px solid blue">
            <button onclick="test()">Test</button>
        </div>
        <div style="height:300px;width:300px;margin:0 auto;border:1px solid blue">

        </div>
    </div>
    <div style="height:600px;">

    </div>
    <div id="target" style="width:200px;height:250px;position:fixed;background-color:aqua">

    </div>
</body>
</html>
